name: Deploy CPSSec Website to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Setup Node.js
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --include=optional --no-fund

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Run regression tests
        run: npm test

      - name: Verify DOI metadata
        run: npm run check:dois

      - name: Build static site
        run: npm run build
        env:
          NODE_ENV: production
          NEXT_PUBLIC_BASE_PATH: /CPSsecWebsite

      - name: Lint and typecheck
        run: npm run lint && npm run typecheck

      - name: Verify export links
        run: node scripts/check-export.js
        env:
          NEXT_PUBLIC_BASE_PATH: /CPSsecWebsite

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
